<style>
 body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* center hata diya */
  padding-top: 40px; /* upar se space */
  font-family: Arial;
}

/* CARD */
.card {
  position: relative;
  width: 320px;
  height: 500px;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.4s;
  box-shadow: 0 0 20px #ff0;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px #ff0;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.7);
}

/* FLOAT */
.card {
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* START TODAY BUTTON (NOW OUTSIDE) */
.start-btn {
  margin-top: 20px;
  padding: 12px 30px;
  background: gold;
  color: black;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  text-decoration: none;
}

.start-btn:hover {
  background: white;
}

/* WHATSAPP BUTTON */
.whatsapp {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  background: #fbf13d;
  padding: 14px 26px;
  border-radius: 50px;
  font-weight: bold;
  color: black;
  text-decoration: none;
  box-shadow: 0 0 20px rgba(255,255,0,0.7);
  animation: pulse 1.5s infinite;
}

.whatsapp i {
  margin-right: 10px;
  font-size: 20px;
}

.disclaimer {
  margin-top: 5px;
  padding: 5px 20px;
  max-width: 320px;
  text-align: center;
}

.disclaimer h4 {
  margin-bottom: 5px;
  color: #ffeb3b;
}

.disclaimer p {
  font-size: 13px;
  color: #ccc;
  line-height: 1.4;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
